# Iteration 6: test whether the remaining timeout-heavy policy is caused by
# applying one-second-style discount factors at the environment's 5 Hz decision
# frequency. The coupled gamma/GAE change preserves approximately the original
# per-second time scale; all Iteration 5 reward, PPO, budget, and eval settings
# remain unchanged.
agent: "MAPPO"
learner: "MAPPO_Learner"
policy: "Categorical_MAAC_Policy"
representation: "Basic_MLP"
vectorize: "SubprocVecMultiAgentEnv"
use_rnn: false
use_global_state: true
output_dir: "runs/mappo_epochs5_ent03_reward_ordering_timescale_highway/"

n_epochs: 5
ent_coef: 0.03
gamma: 0.998
gae_lambda: 0.99

highway_config:
  collision_reward: -40
  high_speed_reward: 0.01
  arrived_reward: 10

checkpoint_eval_episodes: 50
checkpoint_eval_seed: 10000
final_eval_seed: 20000
eval_parallels: 10
test_episode: 100
