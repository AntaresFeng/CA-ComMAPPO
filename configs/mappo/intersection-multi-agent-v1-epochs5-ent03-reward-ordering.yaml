# Iteration 5: correct the task-reward ordering exposed by Iterations 1-4.
# The three reward coefficients form one coupled contract: full-horizon speed
# shaping must remain small, arrival must dominate timeout, and a collision
# must remain negative even after prior speed shaping. Training and evaluation
# settings otherwise match Iteration 3.
agent: "MAPPO"
learner: "MAPPO_Learner"
policy: "Categorical_MAAC_Policy"
representation: "Basic_MLP"
vectorize: "SubprocVecMultiAgentEnv"
use_rnn: false
use_global_state: true
output_dir: "runs/mappo_epochs5_ent03_reward_ordering_highway/"

n_epochs: 5
ent_coef: 0.03

highway_config:
  collision_reward: -40
  high_speed_reward: 0.01
  arrived_reward: 10

checkpoint_eval_episodes: 50
checkpoint_eval_seed: 10000
final_eval_seed: 20000
eval_parallels: 10
test_episode: 100
