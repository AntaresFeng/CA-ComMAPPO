# Iteration 1: framework-corrected control. Training hyperparameters intentionally
# match the original MAPPO baseline. Runtime framework corrections include masked
# inactive-agent statistics and complete minibatch diagnostics; deterministic
# evaluation, output isolation, and checkpoint provenance are explicit.
agent: "MAPPO"
learner: "MAPPO_Learner"
policy: "Categorical_MAAC_Policy"
representation: "Basic_MLP"
vectorize: "SubprocVecMultiAgentEnv"
use_rnn: false
use_global_state: true
output_dir: "runs/mappo_robust_eval_highway/"

checkpoint_eval_episodes: 50
checkpoint_eval_seed: 10000
final_eval_seed: 20000
eval_parallels: 10
test_episode: 100
