dl_toolbox: "torch"
project_name: "CA-ComMAPPO"
logger: "wandb"
wandb_user_name: "antaresx403-bupt"
render: false
render_mode: "rgb_array"
fps: 15
test_mode: false
device: "cpu"
distributed_training: false
master_port: "12355"

env_name: "HighwayIntersection"
env_id: "ca-intersection-v0"
# Training config loading derives env_seed as seed * 1,000,000 so parallel
# worker seed blocks and reserved evaluation cases do not overlap.
env_seed: 1000000
continuous_action: false

rnn: "GRU"
fc_hidden_sizes: [64, 64, 64]
recurrent_hidden_size: 64
N_recurrent_layers: 1
dropout: 0
normalize: "LayerNorm"
initialize: "orthogonal"
gain: 0.01

flatten_observations: true
representation_hidden_size: [128, 128]
actor_hidden_size: [128, 128]
critic_hidden_size: [128, 128]
activation: "relu"
use_parameter_sharing: true
use_actions_mask: false

seed: 1
parallels: 16
buffer_size: 2048
n_epochs: 5
n_minibatch: 2
learning_rate: 0.0003
weight_decay: 0
vf_coef: 0.5
ent_coef: 0.03
target_kl: 0.25
clip_range: 0.2
clip_type: 1
# Canonical MAPPO baseline discount contract shared by subsequent algorithms
# and paper comparisons.
gamma: 0.99

use_linear_lr_decay: false
end_factor_lr_decay: 0.5
use_value_clip: true
value_clip_range: 0.2
use_value_norm: true
use_huber_loss: true
huber_delta: 10.0
use_advnorm: true
use_gae: true
gae_lambda: 0.95
use_grad_clip: true
grad_clip_norm: 10.0

running_steps: 1000000
eval_interval: 10000
checkpoint_eval_episodes: 50
checkpoint_eval_seed: 10000
final_eval_seed: 20000
eval_parallels: 10
test_episode: 100
